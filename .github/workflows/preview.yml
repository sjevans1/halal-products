name: Tayyib Halal | Preview deploy
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tayyib-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: FAST / native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: JavaScript syntax, API, UI and content checks
        run: npm run check
      - name: Whitespace errors
        run: git diff --check
  preview:
    name: Cloudflare preview deploy (never production)
    needs: checks
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build catalogue and hub pages
        run: npm run build
      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy public \
            --project-name tayyib-halal-preview \
            --branch "$GITHUB_REF_NAME" \
            --commit-hash "$GITHUB_SHA"
